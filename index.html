<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>¡Felices Fiestas! - Club Legislativo</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Great Vibes / Playfair Display & Inter para tipografía festiva y legible -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #0f2e26 0%, #071917 55%, #030b0d 100%);
      font-family: 'Inter', sans-serif;
    }
    #sim-canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none; /* Evita scroll al arrastrar pelotitas en móviles */
    }
    .font-script {
      font-family: 'Great Vibes', cursive;
    }
    .font-serif-festive {
      font-family: 'Playfair Display', serif;
    }
    /* Brillo dorado sutil para el texto central */
    .gold-shimmer {
      background: linear-gradient(135deg, #fff5d6 0%, #f6d365 35%, #fda085 65%, #fff5d6 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 6s linear infinite;
      filter: drop-shadow(0 4px 18px rgba(246, 211, 101, 0.25));
    }
    @keyframes shimmer {
      to {
        background-position: 200% center;
      }
    }
    /* Animación de pulso suave al sacudir */
    @keyframes popBanner {
      0% { transform: scale(1); }
      35% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .shake-pop {
      animation: popBanner 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
  </style>
</head>
<body class="relative w-full h-full">

  <!-- Lienzo principal de física y pelotitas navideñas -->
  <canvas id="sim-canvas"></canvas>

  <!-- Mensaje central navideño (pointer-events-none para interactuar con las pelotitas detrás/encima) -->
  <div id="greeting-overlay" class="pointer-events-none fixed inset-0 flex flex-col items-center justify-center px-4 text-center z-10">
    <div id="greeting-card" class="max-w-2xl px-6 py-7 sm:px-10 sm:py-9 rounded-3xl bg-black/25 backdrop-blur-[3px] border border-amber-200/15 shadow-2xl transition-transform duration-300">
      <!-- Estrella decorativa superior -->
      <div class="flex justify-center mb-2">
        <svg class="w-9 h-9 sm:w-11 sm:h-11 text-amber-300 drop-shadow-[0_0_12px_rgba(252,211,77,0.75)]" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 1.75l2.68 6.82 7.32.45-5.64 4.67 1.82 7.11L12 16.92l-6.18 3.88 1.82-7.11L2 9.02l7.32-.45L12 1.75z"/>
        </svg>
      </div>

      <h1 class="font-script text-5xl sm:text-7xl md:text-8xl leading-tight gold-shimmer select-none py-1">
        ¡Felices Fiestas!
      </h1>

      <div class="w-28 sm:w-40 h-[1.5px] mx-auto my-3 sm:my-4 bg-gradient-to-r from-transparent via-amber-300/70 to-transparent"></div>

      <p class="font-serif-festive italic text-lg sm:text-2xl md:text-3xl text-amber-50/95 tracking-wide drop-shadow">
        les desea el <span class="font-semibold not-italic text-amber-300">Club Legislativo</span>
      </p>

      <p id="mobile-hint" class="mt-3 text-xs sm:text-sm text-emerald-100/70 font-normal">
        Toca, arrastra o sacude tu celular para mover las esferas navideñas
      </p>
    </div>
  </div>

  <!-- Notificación flotante tipo toast (reemplazo elegante sin alert) -->
  <div id="toast-msg" class="fixed top-5 left-1/2 -translate-x-1/2 z-30 pointer-events-none opacity-0 transition-opacity duration-300 px-4 py-2 rounded-full bg-emerald-950/90 border border-amber-300/40 text-amber-100 text-xs sm:text-sm shadow-lg backdrop-blur-md whitespace-nowrap">
    ¡Sensor de movimiento activado! Sacude tu teléfono
  </div>

  <!-- Barra de controles minimalista inferior -->
  <div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-20 flex flex-wrap items-center justify-center gap-2.5 px-3 py-2 rounded-full bg-black/45 backdrop-blur-md border border-white/15 shadow-2xl max-w-[94vw]">
    <!-- Botón para activar sensor de movimiento en móviles (iOS / Android) -->
    <button id="btn-motion" type="button" class="flex items-center gap-1.5 px-3.5 py-2 rounded-full bg-amber-500/20 hover:bg-amber-500/35 active:scale-95 border border-amber-300/40 text-amber-200 text-xs sm:text-sm font-medium transition cursor-pointer">
      <span>📱</span>
      <span id="btn-motion-text">Activar agitado</span>
    </button>

    <!-- Botón manual de sacudir (útil en escritorio o para probar el impulso) -->
    <button id="btn-shake" type="button" class="flex items-center gap-1.5 px-4 py-2 rounded-full bg-gradient-to-r from-red-600/85 to-rose-700/85 hover:from-red-500 hover:to-rose-600 active:scale-95 border border-red-300/30 text-white text-xs sm:text-sm font-semibold shadow-md transition cursor-pointer">
      <span>🎄</span>
      <span>Sacudir</span>
    </button>

    <!-- Botón para reiniciar o agregar pelotitas -->
    <button id="btn-reset" type="button" title="Reiniciar esferas" class="flex items-center gap-1 px-3 py-2 rounded-full bg-white/10 hover:bg-white/20 active:scale-95 border border-white/15 text-emerald-100 text-xs sm:text-sm font-medium transition cursor-pointer">
      <span>✨</span>
      <span class="hidden sm:inline">Reiniciar</span>
    </button>
  </div>

  <script>
    /**
     * Tarjeta Navideña Interactiva - Club Legislativo
     * Simulación 2D de esferas navideñas con texturas PNG generadas proceduralmente,
     * colisiones elásticas entre esferas, repulsión por cursor/dedo y respuesta a sacudidas (devicemotion).
     */

    const canvas = document.getElementById('sim-canvas');
    const ctx = canvas.getContext('2d');
    const greetingCard = document.getElementById('greeting-card');
    const toastEl = document.getElementById('toast-msg');
    const btnMotion = document.getElementById('btn-motion');
    const btnMotionText = document.getElementById('btn-motion-text');
    const btnShake = document.getElementById('btn-shake');
    const btnReset = document.getElementById('btn-reset');

    let width = window.innerWidth;
    let height = window.innerHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    // Estado de puntero (ratón o toque)
    const pointer = {
      x: -9999,
      y: -9999,
      vx: 0,
      vy: 0,
      active: false,
      radius: 130
    };

    // Colecciones de entidades
    let ornaments = [];
    let snowflakes = [];
    let sparkles = [];
    let ornamentSprites = []; // Imágenes PNG generadas con diseño de pelotitas navideñas

    // Mostrar notificación flotante no intrusiva
    let toastTimeout = null;
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.remove('opacity-0');
      toastEl.classList.add('opacity-100');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastEl.classList.remove('opacity-100');
        toastEl.classList.add('opacity-0');
      }, 3000);
    }

    /**
     * Genera sprites PNG de alta resolución (160x160) de distintas pelotitas navideñas
     * con casquillo metálico, argolla superior, brillo especular y adornos festivos.
     */
    function createOrnamentSprites() {
      const themes = [
        {
          name: 'crimson-gold',
          base1: '#ff4d5a',
          base2: '#b80d22',
          base3: '#59020d',
          accent: '#ffd86b',
          pattern: 'snowflake'
        },
        {
          name: 'emerald-gold',
          base1: '#2dd48f',
          base2: '#0b7a4b',
          base3: '#033821',
          accent: '#ffe082',
          pattern: 'bands'
        },
        {
          name: 'royal-gold',
          base1: '#ffe27a',
          base2: '#d99616',
          base3: '#6e4500',
          accent: '#ffffff',
          pattern: 'stars'
        },
        {
          name: 'sapphire-ice',
          base1: '#56b4ff',
          base2: '#1456a8',
          base3: '#06204a',
          accent: '#e0f4ff',
          pattern: 'snowflake'
        },
        {
          name: 'candy-ruby',
          base1: '#ff758f',
          base2: '#c9184a',
          base3: '#590d22',
          accent: '#fff0f3',
          pattern: 'stripes'
        },
        {
          name: 'pearl-champagne',
          base1: '#fff8eb',
          base2: '#e3c598',
          base3: '#8c6d46',
          accent: '#d62828',
          pattern: 'dots'
        }
      ];

      const size = 180;
      const center = size / 2;
      const ballRadius = 66;
      const ballCenterY = center + 8;

      return themes.map((theme) => {
        const off = document.createElement('canvas');
        off.width = size;
        off.height = size;
        const octx = off.getContext('2d');

        // 1. Argolla metálica superior
        octx.save();
        octx.strokeStyle = '#f6d365';
        octx.lineWidth = 4.5;
        octx.beginPath();
        octx.arc(center, ballCenterY - ballRadius - 13, 8, 0, Math.PI * 2);
        octx.stroke();

        // 2. Casquillo dorado de la esfera
        const capGrad = octx.createLinearGradient(center - 15, 0, center + 15, 0);
        capGrad.addColorStop(0, '#9c6b19');
        capGrad.addColorStop(0.35, '#ffe58f');
        capGrad.addColorStop(0.7, '#d49b27');
        capGrad.addColorStop(1, '#7a500c');
        octx.fillStyle = capGrad;
        octx.beginPath();
        octx.roundRect(center - 15, ballCenterY - ballRadius - 8, 30, 14, 4);
        octx.fill();
        octx.restore();

        // 3. Cuerpo principal de la esfera navideña
        octx.save();
        octx.beginPath();
        octx.arc(center, ballCenterY, ballRadius, 0, Math.PI * 2);
        octx.clip();

        // Gradiente esférico 3D
        const sphereGrad = octx.createRadialGradient(
          center - ballRadius * 0.35,
          ballCenterY - ballRadius * 0.35,
          ballRadius * 0.08,
          center,
          ballCenterY,
          ballRadius
        );
        sphereGrad.addColorStop(0, theme.base1);
        sphereGrad.addColorStop(0.65, theme.base2);
        sphereGrad.addColorStop(1, theme.base3);
        octx.fillStyle = sphereGrad;
        octx.fillRect(0, 0, size, size);

        // 4. Patrones decorativos internos según el estilo
        octx.strokeStyle = theme.accent;
        octx.fillStyle = theme.accent;
        octx.globalAlpha = 0.82;

        if (theme.pattern === 'bands') {
          // Bandas doradas festivas horizontales y zig-zag
          octx.lineWidth = 4;
          octx.beginPath();
          octx.moveTo(center - ballRadius, ballCenterY - 16);
          octx.lineTo(center + ballRadius, ballCenterY - 16);
          octx.moveTo(center - ballRadius, ballCenterY + 16);
          octx.lineTo(center + ballRadius, ballCenterY + 16);
          octx.stroke();

          // Puntos brillantes en el centro
          for (let x = -48; x <= 48; x += 24) {
            octx.beginPath();
            octx.arc(center + x, ballCenterY, 4, 0, Math.PI * 2);
            octx.fill();
          }
        } else if (theme.pattern === 'snowflake') {
          // Copo de nieve estilizado en el centro
          octx.lineWidth = 3.2;
          octx.lineCap = 'round';
          for (let i = 0; i < 6; i++) {
            const angle = (i * Math.PI) / 3;
            const dx = Math.cos(angle) * 30;
            const dy = Math.sin(angle) * 30;
            octx.beginPath();
            octx.moveTo(center, ballCenterY);
            octx.lineTo(center + dx, ballCenterY + dy);
            octx.stroke();

            // Ramitas del copo
            const bx = center + Math.cos(angle) * 18;
            const by = ballCenterY + Math.sin(angle) * 18;
            octx.beginPath();
            octx.moveTo(bx, by);
            octx.lineTo(bx + Math.cos(angle + 0.6) * 9, by + Math.sin(angle + 0.6) * 9);
            octx.moveTo(bx, by);
            octx.lineTo(bx + Math.cos(angle - 0.6) * 9, by + Math.sin(angle - 0.6) * 9);
            octx.stroke();
          }
        } else if (theme.pattern === 'stars') {
          // Constelación de estrellitas navideñas
          const starOffsets = [
            [0, 0, 12],
            [-30, -20, 7],
            [32, -16, 7],
            [-24, 26, 7],
            [26, 24, 8]
          ];
          starOffsets.forEach(([ox, oy, sr]) => {
            drawMiniStar(octx, center + ox, ballCenterY + oy, 5, sr, sr * 0.45);
          });
        } else if (theme.pattern === 'stripes') {
          // Franjas diagonales estilo bastón de caramelo
          octx.lineWidth = 9;
          for (let offset = -90; offset <= 90; offset += 34) {
            octx.beginPath();
            octx.moveTo(center + offset - 40, ballCenterY - 70);
            octx.lineTo(center + offset + 40, ballCenterY + 70);
            octx.stroke();
          }
        } else if (theme.pattern === 'dots') {
          // Lunares festivos
          for (let row = -2; row <= 2; row++) {
            for (let col = -2; col <= 2; col++) {
              if ((row + col) % 2 === 0) {
                octx.beginPath();
                octx.arc(center + col * 24, ballCenterY + row * 24, 5, 0, Math.PI * 2);
                octx.fill();
              }
            }
          }
        }

        // 5. Sombra inferior interna para profundidad
        const rimShadow = octx.createRadialGradient(
          center,
          ballCenterY,
          ballRadius * 0.65,
          center,
          ballCenterY,
          ballRadius
        );
        rimShadow.addColorStop(0, 'rgba(0,0,0,0)');
        rimShadow.addColorStop(1, 'rgba(0,0,0,0.42)');
        octx.globalAlpha = 1;
        octx.fillStyle = rimShadow;
        octx.fillRect(0, 0, size, size);

        // 6. Reflejo especular brillante (brillo de cristal)
        octx.save();
        octx.translate(center - ballRadius * 0.36, ballCenterY - ballRadius * 0.36);
        octx.rotate(-Math.PI / 4);
        const glossGrad = octx.createRadialGradient(0, 0, 1, 0, 0, 24);
        glossGrad.addColorStop(0, 'rgba(255, 255, 255, 0.88)');
        glossGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.32)');
        glossGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
        octx.fillStyle = glossGrad;
        octx.beginPath();
        octx.ellipse(0, 0, 22, 12, 0, 0, Math.PI * 2);
        octx.fill();
        octx.restore();

        octx.restore();

        // Convertir a imagen PNG real (Data URL) para cumplir con sprites PNG nítidos
        const img = new Image();
        img.src = off.toDataURL('image/png');
        return img;
      });
    }

    function drawMiniStar(context, cx, cy, spikes, outerR, innerR) {
      let rot = (Math.PI / 2) * 3;
      let x = cx;
      let y = cy;
      const step = Math.PI / spikes;

      context.beginPath();
      context.moveTo(cx, cy - outerR);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerR;
        y = cy + Math.sin(rot) * outerR;
        context.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerR;
        y = cy + Math.sin(rot) * innerR;
        context.lineTo(x, y);
        rot += step;
      }
      context.lineTo(cx, cy - outerR);
      context.closePath();
      context.fill();
    }

    /**
     * Clase que representa cada pelotita navideña con física 2D
     */
    class OrnamentBall {
      constructor(x, y, radius, sprite) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.mass = radius * radius * 0.05;
        this.sprite = sprite;

        // Velocidad inicial suave flotante
        const angle = Math.random() * Math.PI * 2;
        const speed = 0.6 + Math.random() * 1.4;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        // Rotación suave
        this.rotation = (Math.random() - 0.5) * 0.5;
        this.vRot = (Math.random() - 0.5) * 0.015;
      }

      update() {
        // Flotación orgánica leve + resistencia del aire (damping suave)
        this.vx *= 0.992;
        this.vy *= 0.992;

        // Mantener un movimiento ambiental suave para que nunca queden estáticas
        const speed = Math.hypot(this.vx, this.vy);
        if (speed < 0.45) {
          const nudgeAngle = Math.random() * Math.PI * 2;
          this.vx += Math.cos(nudgeAngle) * 0.03;
          this.vy += Math.sin(nudgeAngle) * 0.03;
        }

        // Limitar velocidad máxima tras una sacudida fuerte
        const maxSpeed = 28;
        if (speed > maxSpeed) {
          this.vx = (this.vx / speed) * maxSpeed;
          this.vy = (this.vy / speed) * maxSpeed;
        }

        // Repulsión suave e impulso con el cursor / dedo (estilo CodePen vxMYEz)
        if (pointer.active) {
          const dx = this.x - pointer.x;
          const dy = this.y - pointer.y;
          const dist = Math.hypot(dx, dy);
          const minDist = this.radius + pointer.radius;

          if (dist < minDist && dist > 0.001) {
            const force = (minDist - dist) / minDist;
            const nx = dx / dist;
            const ny = dy / dist;

            // Empuje radial + arrastre direccional del movimiento del dedo/ratón
            this.vx += nx * force * 2.1 + pointer.vx * 0.06 * force;
            this.vy += ny * force * 2.1 + pointer.vy * 0.06 * force;
            this.vRot += (nx * pointer.vy - ny * pointer.vx) * 0.0005;
          }
        }

        // Actualizar posición y ángulo
        this.x += this.vx;
        this.y += this.vy;
        this.rotation += this.vRot + this.vx * 0.0035;
        this.vRot *= 0.985;

        // Rebote elástico en los bordes de la pantalla
        const bounce = 0.86;
        if (this.x - this.radius < 0) {
          this.x = this.radius;
          this.vx = Math.abs(this.vx) * bounce;
          this.vRot = this.vy * 0.004;
        } else if (this.x + this.radius > width) {
          this.x = width - this.radius;
          this.vx = -Math.abs(this.vx) * bounce;
          this.vRot = -this.vy * 0.004;
        }

        if (this.y - this.radius < 0) {
          this.y = this.radius;
          this.vy = Math.abs(this.vy) * bounce;
        } else if (this.y + this.radius > height) {
          this.y = height - this.radius;
          this.vy = -Math.abs(this.vy) * bounce;
        }
      }

      draw(context) {
        context.save();
        context.translate(this.x, this.y);
        context.rotate(this.rotation);

        // Sombra suave proyectada
        context.shadowColor = 'rgba(0, 0, 0, 0.38)';
        context.shadowBlur = 12;
        context.shadowOffsetY = 6;

        // Dibujar el sprite PNG escalado (compensando el casquillo superior del canvas 180x180)
        const drawScale = (this.radius * 2) / 132;
        const spriteSize = 180 * drawScale;
        const offsetY = -8 * drawScale;

        if (this.sprite && this.sprite.complete) {
          context.drawImage(
            this.sprite,
            -spriteSize / 2,
            -spriteSize / 2 + offsetY,
            spriteSize,
            spriteSize
          );
        } else {
          // Fallback circular inmediato mientras carga el PNG en el primer frame
          context.beginPath();
          context.arc(0, 0, this.radius, 0, Math.PI * 2);
          context.fillStyle = '#c9184a';
          context.fill();
        }

        context.restore();
      }
    }

    /**
     * Resuelve colisiones elásticas entre todas las pelotitas navideñas
     */
    function resolveBallCollisions() {
      const restitution = 0.88;
      for (let i = 0; i < ornaments.length; i++) {
        const b1 = ornaments[i];
        for (let j = i + 1; j < ornaments.length; j++) {
          const b2 = ornaments[j];
          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = b1.radius + b2.radius;

          if (dist < minDist && dist > 0.0001) {
            // Separar superposición proporcional a la masa
            const overlap = minDist - dist;
            const nx = dx / dist;
            const ny = dy / dist;
            const totalMass = b1.mass + b2.mass;

            b1.x -= nx * overlap * (b2.mass / totalMass);
            b1.y -= ny * overlap * (b2.mass / totalMass);
            b2.x += nx * overlap * (b1.mass / totalMass);
            b2.y += ny * overlap * (b1.mass / totalMass);

            // Velocidad relativa a lo largo de la normal
            const rvx = b2.vx - b1.vx;
            const rvy = b2.vy - b1.vy;
            const velAlongNormal = rvx * nx + rvy * ny;

            if (velAlongNormal < 0) {
              const impulse = (-(1 + restitution) * velAlongNormal) / (1 / b1.mass + 1 / b2.mass);
              const impulseX = impulse * nx;
              const impulseY = impulse * ny;

              b1.vx -= impulseX / b1.mass;
              b1.vy -= impulseY / b1.mass;
              b2.vx += impulseX / b2.mass;
              b2.vy += impulseY / b2.mass;

              // Efecto de giro al chocar
              b1.vRot += (nx * rvy - ny * rvx) * 0.0012;
              b2.vRot -= (nx * rvy - ny * rvx) * 0.0012;
            }
          }
        }
      }
    }

    /**
     * Crea destellos dorados al hacer clic o sacudir
     */
    function spawnSparkles(x, y, count = 16) {
      const colors = ['#ffe58f', '#ffd666', '#ffffff', '#ff7875', '#95de64'];
      for (let i = 0; i < count; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 5.5;
        sparkles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          size: 2 + Math.random() * 3.5,
          alpha: 1,
          decay: 0.018 + Math.random() * 0.02,
          color: colors[Math.floor(Math.random() * colors.length)]
        });
      }
    }

    /**
     * Aplica un impulso fuerte a todas las esferas navideñas (al sacudir el celular o pulsar Sacudir)
     */
    function triggerShakeImpulse(intensity = 18, dirX = 0, dirY = 0) {
      // Animar tarjeta de saludo
      greetingCard.classList.remove('shake-pop');
      void greetingCard.offsetWidth; // Reiniciar reflow para repetir animación
      greetingCard.classList.add('shake-pop');

      ornaments.forEach((ball) => {
        const angle = Math.random() * Math.PI * 2;
        const burst = intensity * (0.65 + Math.random() * 0.75);

        // Combinar dirección del acelerómetro (si existe) con dispersión festiva
        ball.vx += Math.cos(angle) * burst + dirX * 0.8;
        ball.vy += Math.sin(angle) * burst - Math.abs(dirY) * 0.6 - 4;
        ball.vRot += (Math.random() - 0.5) * 0.25;
      });

      // Generar destellos festivos en varios puntos
      for (let i = 0; i < 5; i++) {
        spawnSparkles(
          width * (0.2 + Math.random() * 0.6),
          height * (0.2 + Math.random() * 0.6),
          12
        );
      }

      // Vibración háptica suave en Android si está disponible
      if (navigator.vibrate) {
        try {
          navigator.vibrate([45, 30, 60]);
        } catch (e) {
          // Ignorar si no es soportado
        }
      }
    }

    /**
     * Inicializa nieve ambiental y pelotitas navideñas adaptadas al tamaño de pantalla
     */
    function initScene() {
      ornaments = [];
      snowflakes = [];

      // Cantidad adaptativa según tamaño de pantalla
      const area = width * height;
      const isMobile = width < 640;
      const ballCount = isMobile
        ? Math.min(24, Math.max(15, Math.floor(area / 22000)))
        : Math.min(38, Math.max(22, Math.floor(area / 34000)));

      const minR = isMobile ? 20 : 24;
      const maxR = isMobile ? 36 : 46;

      for (let i = 0; i < ballCount; i++) {
        const radius = minR + Math.random() * (maxR - minR);
        let x, y, tries = 0;
        // Evitar que nazcan encimadas
        do {
          x = radius + Math.random() * (width - radius * 2);
          y = radius + Math.random() * (height - radius * 2);
          tries++;
        } while (
          tries < 25 &&
          ornaments.some((o) => Math.hypot(o.x - x, o.y - y) < o.radius + radius + 6)
        );

        const sprite = ornamentSprites[i % ornamentSprites.length];
        ornaments.push(new OrnamentBall(x, y, radius, sprite));
      }

      // Copos de nieve suaves en segundo plano
      const snowCount = isMobile ? 45 : 85;
      for (let i = 0; i < snowCount; i++) {
        snowflakes.push({
          x: Math.random() * width,
          y: Math.random() * height,
          r: 1 + Math.random() * 2.6,
          vy: 0.4 + Math.random() * 1.1,
          vx: (Math.random() - 0.5) * 0.4,
          phase: Math.random() * Math.PI * 2,
          alpha: 0.25 + Math.random() * 0.55
        });
      }
    }

    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Reubicar pelotitas si quedaron fuera del nuevo viewport
      ornaments.forEach((b) => {
        b.x = Math.min(Math.max(b.radius, b.x), width - b.radius);
        b.y = Math.min(Math.max(b.radius, b.y), height - b.radius);
      });
    }

    /**
     * Bucle principal de animación a 60fps
     */
    function animate() {
      ctx.clearRect(0, 0, width, height);

      // 1. Dibujar nieve ambiental de fondo
      snowflakes.forEach((flake) => {
        flake.phase += 0.02;
        flake.x += flake.vx + Math.sin(flake.phase) * 0.25;
        flake.y += flake.vy;

        if (flake.y > height + 5) {
          flake.y = -5;
          flake.x = Math.random() * width;
        }
        if (flake.x > width + 5) flake.x = -5;
        if (flake.x < -5) flake.x = width + 5;

        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 255, 255, ${flake.alpha})`;
        ctx.fill();
      });

      // 2. Actualizar física y colisiones de pelotitas navideñas
      for (let i = 0; i < ornaments.length; i++) {
        ornaments[i].update();
      }
      resolveBallCollisions();

      // 3. Dibujar pelotitas navideñas
      for (let i = 0; i < ornaments.length; i++) {
        ornaments[i].draw(ctx);
      }

      // 4. Actualizar y dibujar destellos dorados
      for (let i = sparkles.length - 1; i >= 0; i--) {
        const sp = sparkles[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.vx *= 0.96;
        sp.vy *= 0.96;
        sp.alpha -= sp.decay;

        if (sp.alpha <= 0) {
          sparkles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = sp.alpha;
        ctx.fillStyle = sp.color;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Desvanecer velocidad del puntero suavemente
      pointer.vx *= 0.85;
      pointer.vy *= 0.85;

      requestAnimationFrame(animate);
    }

    // --- Eventos de Interacción (Mouse y Pantalla Táctil) ---
    let lastPointerX = 0;
    let lastPointerY = 0;

    function updatePointerPosition(clientX, clientY) {
      if (pointer.active) {
        pointer.vx = clientX - lastPointerX;
        pointer.vy = clientY - lastPointerY;
      }
      pointer.x = clientX;
      pointer.y = clientY;
      pointer.active = true;
      lastPointerX = clientX;
      lastPointerY = clientY;
    }

    canvas.addEventListener('mousemove', (e) => {
      updatePointerPosition(e.clientX, e.clientY);
    });

    canvas.addEventListener('mouseleave', () => {
      pointer.active = false;
    });

    canvas.addEventListener('mousedown', (e) => {
      updatePointerPosition(e.clientX, e.clientY);
      spawnSparkles(e.clientX, e.clientY, 14);
      // Impulso radial al hacer clic
      ornaments.forEach((ball) => {
        const dx = ball.x - e.clientX;
        const dy = ball.y - e.clientY;
        const dist = Math.hypot(dx, dy);
        if (dist < 220 && dist > 0.1) {
          const force = ((220 - dist) / 220) * 14;
          ball.vx += (dx / dist) * force;
          ball.vy += (dy / dist) * force;
        }
      });
    });

    canvas.addEventListener('touchstart', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        pointer.active = false;
        updatePointerPosition(t.clientX, t.clientY);
        spawnSparkles(t.clientX, t.clientY, 14);
      }
    }, { passive: true });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) {
        const t = e.touches[0];
        updatePointerPosition(t.clientX, t.clientY);
      }
    }, { passive: true });

    canvas.addEventListener('touchend', () => {
      pointer.active = false;
    });

    // --- Detección de Sacudida en Móviles (DeviceMotion / Acelerómetro) ---
    let motionEnabled = false;
    let lastAccX = null;
    let lastAccY = null;
    let lastAccZ = null;
    let lastShakeTime = 0;

    function handleDeviceMotion(event) {
      const acc = event.accelerationIncludingGravity || event.acceleration;
      if (!acc || acc.x === null) return;

      if (lastAccX !== null) {
        const deltaX = acc.x - lastAccX;
        const deltaY = acc.y - lastAccY;
        const deltaZ = acc.z - lastAccZ;

        const accelerationDelta = Math.hypot(deltaX, deltaY, deltaZ);
        const now = Date.now();

        // Umbral de sacudida sensible pero sin disparos accidentales al caminar
        if (accelerationDelta > 15 && now - lastShakeTime > 420) {
          lastShakeTime = now;
          const power = Math.min(28, Math.max(14, accelerationDelta * 0.85));
          triggerShakeImpulse(power, deltaX, deltaY);
        }
      }

      lastAccX = acc.x;
      lastAccY = acc.y;
      lastAccZ = acc.z;
    }

    async function enableMotionSensor() {
      if (motionEnabled) {
        triggerShakeImpulse(18);
        return;
      }

      // iOS 13+ requiere permiso explícito mediante interacción del usuario
      if (
        typeof DeviceMotionEvent !== 'undefined' &&
        typeof DeviceMotionEvent.requestPermission === 'function'
      ) {
        try {
          const permission = await DeviceMotionEvent.requestPermission();
          if (permission === 'granted') {
            window.addEventListener('devicemotion', handleDeviceMotion);
            motionEnabled = true;
            btnMotionText.textContent = 'Agitado activo';
            btnMotion.classList.add('bg-emerald-500/30', 'border-emerald-300/60', 'text-emerald-200');
            showToast('¡Listo! Sacude tu celular para mover las esferas 🎄');
            triggerShakeImpulse(15);
          } else {
            showToast('Permiso denegado. Puedes usar el botón "Sacudir"');
          }
        } catch (err) {
          showToast('No se pudo activar el sensor. Usa el botón "Sacudir"');
        }
      } else if ('ondevicemotion' in window) {
        // Android y navegadores móviles que no requieren requestPermission
        window.addEventListener('devicemotion', handleDeviceMotion);
        motionEnabled = true;
        btnMotionText.textContent = 'Agitado activo';
        btnMotion.classList.add('bg-emerald-500/30', 'border-emerald-300/60', 'text-emerald-200');
        showToast('¡Sensor activo! Sacude tu dispositivo 🎄');
        triggerShakeImpulse(15);
      } else {
        showToast('Tu dispositivo no tiene acelerómetro; usa el botón "Sacudir"');
        triggerShakeImpulse(18);
      }
    }

    // Activar automáticamente en Android si está disponible sin diálogo de permiso
    if (
      'ondevicemotion' in window &&
      typeof DeviceMotionEvent !== 'undefined' &&
      typeof DeviceMotionEvent.requestPermission !== 'function'
    ) {
      window.addEventListener('devicemotion', handleDeviceMotion);
      motionEnabled = true;
      btnMotionText.textContent = 'Agitado activo';
    }

    // Botones de control
    btnMotion.addEventListener('click', enableMotionSensor);
    btnShake.addEventListener('click', () => {
      triggerShakeImpulse(20);
    });
    btnReset.addEventListener('click', () => {
      initScene();
      showToast('Esferas navideñas reiniciadas ✨');
    });

    window.addEventListener('resize', resizeCanvas);

    // Arranque al cargar la ventana
    window.onload = function () {
      ornamentSprites = createOrnamentSprites();
      resizeCanvas();
      initScene();
      animate();
    };
  </script>
</body>
</html>
