  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, #0f2e26 0%, #071917 55%, #030b0d 100%);
      font-family: 'Inter', sans-serif;
    }
    #canvas {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    .font-script {
      font-family: 'Great Vibes', cursive;
    }
    .font-serif-festive {
      font-family: 'Playfair Display', serif;
    }
    /* Brillo dorado animado para el título principal */
    .gold-shimmer {
      background: linear-gradient(135deg, #fff5d6 0%, #f6d365 35%, #fda085 65%, #fff5d6 100%);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: shimmer 6s linear infinite;
      filter: drop-shadow(0 4px 18px rgba(246, 211, 101, 0.35));
    }
    @keyframes shimmer {
      to {
        background-position: 200% center;
      }
    }
    /* Resplandor dorado sutil y flotación suave para el emblema institucional */
    .logo-glow {
      filter: drop-shadow(0 0 18px rgba(252, 211, 77, 0.48)) drop-shadow(0 6px 14px rgba(0, 0, 0, 0.65));
      animation: floatLogo 5s ease-in-out infinite;
    }
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    /* Animación de pulso al sacudir */
    @keyframes popBanner {
      0% { transform: scale(1); }
      35% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }
    .shake-pop {
      animation: popBanner 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }
    /* Barras ecualizadoras animadas cuando suena la música */
    @keyframes eqBar {
      0%, 100% { height: 4px; }
      50% { height: 14px; }
    }
    .eq-playing span:nth-child(1) { animation: eqBar 0.6s ease-in-out infinite; }
    .eq-playing span:nth-child(2) { animation: eqBar 0.45s ease-in-out infinite 0.15s; }
    .eq-playing span:nth-child(3) { animation: eqBar 0.7s ease-in-out infinite 0.3s; }
  </style>
</head>
<body class="relative w-screen h-screen overflow-hidden border border-amber-400/20">

  <audio id="miAudio" preload="auto" loop>
    <source src="https://raw.githubusercontent.com/intelliwebs/mp3/main/Mariah%20Carey%20-%20All%20I%20Want%20for%20Christmas%20Is%20You%20%28Make%20My%20Wish%20Come%20True%20Edition%29.mp3" type="audio/mpeg">
    Tu navegador no puede reproducir audio HTML5.
  </audio>

  <script>
    // =========================================================================
    // 🎵 AUDIO NAVIDEÑO DESDE GITHUB
    // =========================================================================
    const AUDIO_URL = "https://raw.githubusercontent.com/intelliwebs/mp3/main/Mariah%20Carey%20-%20All%20I%20Want%20for%20Christmas%20Is%20You%20%28Make%20My%20Wish%20Come%20True%20Edition%29.mp3";
    // =========================================================================

    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const greetingCard = document.getElementById('greeting-card');
    const toastEl = document.getElementById('toast-msg');
    const btnMotion = document.getElementById('btn-motion');
    const btnMotionText = document.getElementById('btn-motion-text');
    const btnShake = document.getElementById('btn-shake');
    const btnReset = document.getElementById('btn-reset');

    // Controles de audio
    const btnAudio = document.getElementById('btn-audio');
    const iconPlay = document.getElementById('icon-play');
    const iconPause = document.getElementById('icon-pause');
    const audioStatus = document.getElementById('audio-status');
    const audioLabel = document.getElementById('audio-label');
    const eqBars = document.getElementById('eq-bars');

    let width = window.innerWidth;
    let height = window.innerHeight;
    let dpr = Math.min(window.devicePixelRatio || 1, 2);

    // Estado del puntero (ratón / dedo)
    const pointer = {
      x: -9999,
      y: -9999,
      prevX: -9999,
      prevY: -9999,
      vx: 0,
      vy: 0,
      active: false,
      radius: 145
    };

    let ornaments = [];
    let snowflakes = [];
    let sparkles = [];
    let shockwaves = [];
    let ornamentSprites = [];
    let animationId = null;

    // Notificación flotante tipo toast
    let toastTimeout = null;
    function showToast(message) {
      toastEl.textContent = message;
      toastEl.classList.remove('opacity-0');
      toastEl.classList.add('opacity-100');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toastEl.classList.remove('opacity-100');
        toastEl.classList.add('opacity-0');
      }, 3000);
    }

    // =========================================================================
    // 1. REPRODUCTOR DE AUDIO DESDE GITHUB
    // =========================================================================
    let isPlaying = false;
    // Se utiliza el elemento <audio> del HTML para que el navegador
    // gestione correctamente la carga y reproducción progresiva del MP3.
    const audioElement = document.getElementById('miAudio');
    audioElement.loop = true;
    audioElement.preload = 'auto';

    function updateAudioUI(playing, labelText = 'Música', statusText = '') {
      isPlaying = playing;
      audioLabel.textContent = labelText;
      if (playing) {
        iconPlay.classList.add('hidden');
        iconPause.classList.remove('hidden');
        eqBars.classList.remove('opacity-40');
        eqBars.classList.add('opacity-100', 'eq-playing');
        audioStatus.textContent = statusText || 'Sonando';
      } else {
        iconPause.classList.add('hidden');
        iconPlay.classList.remove('hidden');
        eqBars.classList.remove('opacity-100', 'eq-playing');
        eqBars.classList.add('opacity-40');
        audioStatus.textContent = statusText || 'Pausado';
      }
    }

    async function toggleAudio() {
      if (isPlaying) {
        audioElement.pause();
        updateAudioUI(false, 'Mariah Carey', 'Pausado');
        return;
      }

      try {
        await audioElement.play();
        updateAudioUI(true, 'Mariah Carey', 'Sonando');
      } catch (err) {
        updateAudioUI(false, 'Mariah Carey', 'No se pudo cargar el audio');
        console.error('Error al reproducir el MP3:', err);
        showToast('No se pudo reproducir la canción. Verifica el enlace de GitHub.');
      }
    }

    audioElement.addEventListener('play', () => {
      updateAudioUI(true, 'Mariah Carey', 'Sonando');
    });

    audioElement.addEventListener('pause', () => {
      if (!audioElement.ended) updateAudioUI(false, 'Mariah Carey', 'Pausado');
    });

    audioElement.addEventListener('waiting', () => {
      audioStatus.textContent = 'Cargando canción…';
    });

    audioElement.addEventListener('canplay', () => {
      if (!audioElement.paused) audioStatus.textContent = 'Sonando';
    });

    audioElement.addEventListener('ended', () => {
      updateAudioUI(false, 'Mariah Carey', 'Finalizado');
    });

    audioElement.addEventListener('error', () => {
      updateAudioUI(false, 'Mariah Carey', 'Error de audio');
      console.error('No se pudo cargar el MP3. Comprueba que el repositorio sea público y que el archivo exista.');
      showToast('No se pudo cargar la canción. Comprueba el archivo de GitHub.');
    });

    btnAudio.addEventListener('click', toggleAudio);
    // =========================================================================
    // 2. GENERACIÓN DE SPRITES DE ESFERAS NAVIDEÑAS BRILLANTES EN CANVAS
    // =========================================================================
    function createOrnamentSprites() {
      const themes = [
        { name: 'Rojo Carmesí', base: '#dc2626', light: '#fca5a5', dark: '#7f1d1d', accent: '#fde047', pattern: 'snowflake' },
        { name: 'Verde Esmeralda', base: '#059669', light: '#6ee7b7', dark: '#064e3b', accent: '#fef08a', pattern: 'band' },
        { name: 'Dorado Imperial', base: '#d97706', light: '#fef08a', dark: '#78350f', accent: '#ffffff', pattern: 'stars' },
        { name: 'Azul Real', base: '#2563eb', light: '#93c5fd', dark: '#1e3a8a', accent: '#fde68a', pattern: 'snowflake' },
        { name: 'Púrpura Festivo', base: '#7c3aed', light: '#c4b5fd', dark: '#4c1d95', accent: '#fde047', pattern: 'band' },
        { name: 'Rojo Rubí', base: '#b91c1c', light: '#fecaca', dark: '#450a0a', accent: '#facc15', pattern: 'stars' }
      ];

      const spriteSize = 220;
      const center = spriteSize / 2;
      const ballRadius = 78;

      ornamentSprites = themes.map((theme) => {
        const off = document.createElement('canvas');
        off.width = spriteSize;
        off.height = spriteSize;
        const octx = off.getContext('2d');

        // 1. Argolla superior dorada
        octx.save();
        octx.strokeStyle = '#fbbf24';
        octx.lineWidth = 4.5;
        octx.beginPath();
        octx.arc(center, center - ballRadius - 16, 8, 0, Math.PI * 2);
        octx.stroke();

        // 2. Casquillo metálico dorado
        const capGrad = octx.createLinearGradient(center - 15, 0, center + 15, 0);
        capGrad.addColorStop(0, '#92400e');
        capGrad.addColorStop(0.35, '#fde047');
        capGrad.addColorStop(0.7, '#d97706');
        capGrad.addColorStop(1, '#78350f');
        octx.fillStyle = capGrad;
        octx.beginPath();
        octx.roundRect(center - 14, center - ballRadius - 10, 28, 15, 4);
        octx.fill();
        octx.restore();

        // 3. Cuerpo esférico principal con sombreado 3D
        octx.save();
        octx.beginPath();
        octx.arc(center, center + 4, ballRadius, 0, Math.PI * 2);
        octx.closePath();

        const sphereGrad = octx.createRadialGradient(
          center - ballRadius * 0.35,
          center - ballRadius * 0.35,
          ballRadius * 0.08,
          center,
          center + 4,
          ballRadius
        );
        sphereGrad.addColorStop(0, theme.light);
        sphereGrad.addColorStop(0.32, theme.base);
        sphereGrad.addColorStop(0.85, theme.dark);
        sphereGrad.addColorStop(1, '#090d16');

        octx.fillStyle = sphereGrad;
        octx.fill();
        octx.clip();

        // 4. Diseños decorativos internos según patrón
        octx.strokeStyle = theme.accent;
        octx.fillStyle = theme.accent;
        octx.globalAlpha = 0.78;

        if (theme.pattern === 'band') {
          // Banda ecuatorial dorada con ondas
          octx.lineWidth = 6;
          octx.beginPath();
          octx.moveTo(center - ballRadius, center - 8);
          octx.quadraticCurveTo(center, center + 6, center + ballRadius, center - 8);
          octx.stroke();

          octx.beginPath();
          octx.moveTo(center - ballRadius, center + 16);
          octx.quadraticCurveTo(center, center + 30, center + ballRadius, center + 16);
          octx.stroke();

          for (let x = -48; x <= 48; x += 24) {
            octx.beginPath();
            octx.arc(center + x, center + 6, 3.5, 0, Math.PI * 2);
            octx.fill();
          }
        } else if (theme.pattern === 'snowflake') {
          // Copo de nieve cristalino central
          octx.lineWidth = 3.5;
          octx.lineCap = 'round';
          const cy = center + 6;
          for (let i = 0; i < 6; i++) {
            const ang = (i * Math.PI) / 3;
            const dx = Math.cos(ang) * 32;
            const dy = Math.sin(ang) * 32;
            octx.beginPath();
            octx.moveTo(center, cy);
            octx.lineTo(center + dx, cy + dy);
            octx.stroke();

            // Ramitas del copo
            const bx = center + Math.cos(ang) * 18;
            const by = cy + Math.sin(ang) * 18;
            octx.beginPath();
            octx.moveTo(bx, by);
            octx.lineTo(bx + Math.cos(ang + 0.6) * 9, by + Math.sin(ang + 0.6) * 9);
            octx.moveTo(bx, by);
            octx.lineTo(bx + Math.cos(ang - 0.6) * 9, by + Math.sin(ang - 0.6) * 9);
            octx.stroke();
          }
        } else if (theme.pattern === 'stars') {
          // Constelación de estrellitas brillantes
          const starOffsets = [
            { x: -26, y: -14, r: 9 },
            { x: 24, y: -6, r: 11 },
            { x: -12, y: 26, r: 10 },
            { x: 26, y: 28, r: 7 },
            { x: 0, y: -32, r: 7 }
          ];
          starOffsets.forEach((st) => {
            drawMiniStar(octx, center + st.x, center + st.y + 4, 5, st.r, st.r * 0.42);
            octx.fill();
          });
        }

        // 5. Reflejo especular de cristal (brillo superior izquierdo)
        octx.globalAlpha = 0.58;
        const glossGrad = octx.createRadialGradient(
          center - 28,
          center - 28,
          2,
          center - 24,
          center - 24,
          34
        );
        glossGrad.addColorStop(0, '#ffffff');
        glossGrad.addColorStop(1, 'rgba(255,255,255,0)');
        octx.fillStyle = glossGrad;
        octx.beginPath();
        octx.ellipse(center - 26, center - 26, 24, 14, -Math.PI / 4, 0, Math.PI * 2);
        octx.fill();

        // Luz de rebote inferior derecha
        octx.globalAlpha = 0.25;
        octx.strokeStyle = '#ffffff';
        octx.lineWidth = 4;
        octx.beginPath();
        octx.arc(center, center + 4, ballRadius - 5, 0.2, 1.3);
        octx.stroke();

        octx.restore();
        return off;
      });
    }

    function drawMiniStar(context, cx, cy, spikes, outerRadius, innerRadius) {
      let rot = (Math.PI / 2) * 3;
      let step = Math.PI / spikes;
      context.beginPath();
      context.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        context.lineTo(cx + Math.cos(rot) * outerRadius, cy + Math.sin(rot) * outerRadius);
        rot += step;
        context.lineTo(cx + Math.cos(rot) * innerRadius, cy + Math.sin(rot) * innerRadius);
        rot += step;
      }
      context.closePath();
    }

    // =========================================================================
    // 3. CLASE DE PELOTITA NAVIDEÑA CON FÍSICA ELÁSTICA Y ROTACIÓN
    // =========================================================================
    class OrnamentBall {
      constructor(x, y, radius, sprite) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.mass = radius * radius;
        this.sprite = sprite;

        // Velocidad inicial continua para que siempre floten y reboten
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.4 + Math.random() * 2.1;
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;

        this.angle = (Math.random() - 0.5) * 0.6;
        this.angularVelocity = (Math.random() - 0.5) * 0.03;
      }

      update() {
        // 1. Repulsión suave al acercar el cursor o dedo
        if (pointer.active) {
          const dx = this.x - pointer.x;
          const dy = this.y - pointer.y;
          const dist = Math.hypot(dx, dy);
          const minDist = this.radius + pointer.radius;

          if (dist < minDist && dist > 0.01) {
            const nx = dx / dist;
            const ny = dy / dist;
            const force = (1 - dist / minDist) * 1.45;
            this.vx += nx * force + pointer.vx * 0.04;
            this.vy += ny * force + pointer.vy * 0.04;
            this.angularVelocity += (nx * pointer.vy - ny * pointer.vx) * 0.0012;
          }
        }

        // 2. Amortiguación muy leve y mantenimiento de energía mínima para movimiento continuo
        this.vx *= 0.996;
        this.vy *= 0.996;
        this.angularVelocity *= 0.985;

        const currentSpeed = Math.hypot(this.vx, this.vy);
        const minCruiseSpeed = 1.15;
        const maxSpeed = 24;

        if (currentSpeed < minCruiseSpeed) {
          if (currentSpeed > 0.001) {
            const boost = minCruiseSpeed / currentSpeed;
            this.vx *= boost;
            this.vy *= boost;
          } else {
            const randAng = Math.random() * Math.PI * 2;
            this.vx = Math.cos(randAng) * minCruiseSpeed;
            this.vy = Math.sin(randAng) * minCruiseSpeed;
          }
        } else if (currentSpeed > maxSpeed) {
          const scale = maxSpeed / currentSpeed;
          this.vx *= scale;
          this.vy *= scale;
        }

        // 3. Actualizar posición y rotación
        this.x += this.vx;
        this.y += this.vy;
        this.angle += this.angularVelocity;

        // 4. Rebote elástico contra los bordes de la pantalla
        const restitution = 0.92;
        if (this.x - this.radius < 0) {
          this.x = this.radius;
          this.vx = Math.abs(this.vx) * restitution;
          this.angularVelocity += this.vy * 0.0015;
        } else if (this.x + this.radius > width) {
          this.x = width - this.radius;
          this.vx = -Math.abs(this.vx) * restitution;
          this.angularVelocity -= this.vy * 0.0015;
        }

        if (this.y - this.radius < 0) {
          this.y = this.radius;
          this.vy = Math.abs(this.vy) * restitution;
          this.angularVelocity -= this.vx * 0.0015;
        } else if (this.y + this.radius > height) {
          this.y = height - this.radius;
          this.vy = -Math.abs(this.vy) * restitution;
          this.angularVelocity += this.vx * 0.0015;
        }
      }

      draw(context) {
        context.save();
        context.translate(this.x, this.y);
        context.rotate(this.angle);

        // Sombra ambiental sutil
        context.shadowColor = 'rgba(0, 0, 0, 0.45)';
        context.shadowBlur = 14;
        context.shadowOffsetY = 8;

        // El sprite tiene tamaño 220 con esfera de radio 78 -> factor de escala = (this.radius / 78) * 220
        const drawSize = this.radius * (220 / 78);
        context.drawImage(
          this.sprite,
          -drawSize / 2,
          -drawSize / 2 - (4 * (this.radius / 78)),
          drawSize,
          drawSize
        );
        context.restore();
      }
    }

    // Colisión elástica 2D con conservación de momento y transferencia de giro
    function resolveBallCollisions() {
      const restitution = 0.94;
      for (let i = 0; i < ornaments.length; i++) {
        for (let j = i + 1; j < ornaments.length; j++) {
          const b1 = ornaments[i];
          const b2 = ornaments[j];

          const dx = b2.x - b1.x;
          const dy = b2.y - b1.y;
          const dist = Math.hypot(dx, dy);
          const minDist = b1.radius + b2.radius;

          if (dist < minDist && dist > 0.0001) {
            const nx = dx / dist;
            const ny = dy / dist;

            // Separar esferas solapadas proporcionalmente a su masa
            const overlap = minDist - dist;
            const totalMass = b1.mass + b2.mass;
            b1.x -= nx * overlap * (b2.mass / totalMass);
            b1.y -= ny * overlap * (b2.mass / totalMass);
            b2.x += nx * overlap * (b1.mass / totalMass);
            b2.y += ny * overlap * (b1.mass / totalMass);

            // Velocidad relativa
            const rvx = b2.vx - b1.vx;
            const rvy = b2.vy - b1.vy;
            const velAlongNormal = rvx * nx + rvy * ny;

            if (velAlongNormal < 0) {
              const impulse = (-(1 + restitution) * velAlongNormal) / (1 / b1.mass + 1 / b2.mass);
              const impulseX = impulse * nx;
              const impulseY = impulse * ny;

              b1.vx -= impulseX / b1.mass;
              b1.vy -= impulseY / b1.mass;
              b2.vx += impulseX / b2.mass;
              b2.vy += impulseY / b2.mass;

              // Transferencia de rotación por fricción tangencial
              const tx = -ny;
              const ty = nx;
              const tangentVel = rvx * tx + rvy * ty;
              b1.angularVelocity += (tangentVel * 0.0018);
              b2.angularVelocity -= (tangentVel * 0.0018);

              // Destellos dorados si el choque es enérgico
              if (Math.abs(velAlongNormal) > 3.2) {
                const contactX = b1.x + nx * b1.radius;
                const contactY = b1.y + ny * b1.radius;
                spawnSparkles(contactX, contactY, 5);
              }
            }
          }
        }
      }
    }

    // =========================================================================
    // 4. NIEVE DE FONDO, DESTELLOS DORADOS Y ONDAS EXPANSIVAS
    // =========================================================================
    function initSnowflakes() {
      const count = Math.min(85, Math.floor((width * height) / 14000));
      snowflakes = Array.from({ length: count }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        r: 1.2 + Math.random() * 2.8,
        speedY: 0.45 + Math.random() * 1.1,
        drift: Math.random() * Math.PI * 2,
        alpha: 0.25 + Math.random() * 0.55
      }));
    }

    function spawnSparkles(x, y, count = 10) {
      for (let i = 0; i < count; i++) {
        const ang = Math.random() * Math.PI * 2;
        const spd = 1.5 + Math.random() * 4.5;
        sparkles.push({
          x,
          y,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          size: 1.8 + Math.random() * 3,
          life: 1,
          decay: 0.022 + Math.random() * 0.02,
          color: Math.random() > 0.3 ? '#fde047' : '#ffffff'
        });
      }
    }

    function triggerShockwave(x, y) {
      shockwaves.push({ x, y, radius: 10, maxRadius: 240, alpha: 0.75 });
      spawnSparkles(x, y, 14);

      ornaments.forEach((ball) => {
        const dx = ball.x - x;
        const dy = ball.y - y;
        const dist = Math.hypot(dx, dy);
        if (dist < 280 && dist > 0.1) {
          const strength = (1 - dist / 280) * 14;
          ball.vx += (dx / dist) * strength;
          ball.vy += (dy / dist) * strength;
          ball.angularVelocity += (Math.random() - 0.5) * 0.16;
        }
      });
    }

    // =========================================================================
    // 5. INICIALIZACIÓN DE LAS PELOTITAS NAVIDEÑAS (24 A 28 ESFERAS)
    // =========================================================================
    function initOrnaments() {
      ornaments = [];
      const isMobile = width < 640;
      const count = isMobile ? 12 : 18;
      const minR = isMobile ? 20 : 24;
      const maxR = isMobile ? 36 : 46;

      for (let i = 0; i < count; i++) {
        const radius = minR + Math.random() * (maxR - minR);
        let x = radius + Math.random() * (width - radius * 2);
        let y = radius + Math.random() * (height - radius * 2);

        // Evitar que nazcan encimadas
        for (let attempt = 0; attempt < 25; attempt++) {
          let overlaps = false;
          for (const other of ornaments) {
            if (Math.hypot(x - other.x, y - other.y) < radius + other.radius + 6) {
              overlaps = true;
              break;
            }
          }
          if (!overlaps) break;
          x = radius + Math.random() * (width - radius * 2);
          y = radius + Math.random() * (height - radius * 2);
        }

        const sprite = ornamentSprites[i % ornamentSprites.length];
        ornaments.push(new OrnamentBall(x, y, radius, sprite));
      }
    }

    // =========================================================================
    // 6. DETECCIÓN DE SACUDIDA EN MÓVILES (devicemotion) + BOTÓN MANUAL
    // =========================================================================
    let lastShakeTime = 0;
    let lastAccel = { x: null, y: null, z: null };
    let motionEnabled = false;

    function triggerShakeImpulse(intensity = 1) {
      const now = Date.now();
      if (now - lastShakeTime < 350) return;
      lastShakeTime = now;

      // Vibración háptica en dispositivos compatibles
      if (navigator.vibrate) {
        navigator.vibrate([60, 30, 60]);
      }

      // Animar tarjeta de saludo
      greetingCard.classList.remove('shake-pop');
      void greetingCard.offsetWidth;
      greetingCard.classList.add('shake-pop');

      const power = Math.min(Math.max(intensity, 0.9), 1.8) * 16;
      ornaments.forEach((ball) => {
        const angle = Math.random() * Math.PI * 2;
        const kick = (0.65 + Math.random() * 0.7) * power;
        ball.vx += Math.cos(angle) * kick;
        ball.vy += Math.sin(angle) * kick - 3.5; // Ligero impulso hacia arriba
        ball.angularVelocity += (Math.random() - 0.5) * 0.25;
      });

      // Lluvia de destellos dorados por la pantalla
      for (let i = 0; i < 6; i++) {
        spawnSparkles(
          width * (0.15 + Math.random() * 0.7),
          height * (0.15 + Math.random() * 0.7),
          8
        );
      }
    }

    function handleDeviceMotion(event) {
      const acc = event.acceleration && event.acceleration.x !== null
        ? event.acceleration
        : event.accelerationIncludingGravity;

      if (!acc || acc.x === null) return;

      if (lastAccel.x !== null) {
        const deltaX = Math.abs(acc.x - lastAccel.x);
        const deltaY = Math.abs(acc.y - lastAccel.y);
        const deltaZ = Math.abs(acc.z - lastAccel.z);
        const totalDelta = deltaX + deltaY + deltaZ;

        // Umbral calibrado para sacudida firme del celular
        const threshold = event.acceleration && event.acceleration.x !== null ? 16 : 22;
        if (totalDelta > threshold) {
          triggerShakeImpulse(totalDelta / threshold);
        }
      }

      lastAccel = { x: acc.x, y: acc.y, z: acc.z };
    }

    async function enableMotionSensor() {
      if (motionEnabled) {
        showToast('¡El sensor ya está activo! Agita tu celular 🎄');
        triggerShakeImpulse(1);
        return;
      }

      if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
        try {
          const response = await DeviceMotionEvent.requestPermission();
          if (response === 'granted') {
            window.addEventListener('devicemotion', handleDeviceMotion);
            motionEnabled = true;
            btnMotionText.textContent = 'Sensor activo';
            btnMotion.classList.add('bg-emerald-500/25', 'border-emerald-300/50', 'text-emerald-200');
            showToast('¡Sensor activado! Agita tu teléfono 📱✨');
          } else {
            showToast('Permiso denegado. Usa el botón "Sacudir" 🎄');
          }
        } catch (err) {
          showToast('Usa el botón "Sacudir" para agitar las esferas 🎄');
        }
      } else if ('DeviceMotionEvent' in window) {
        window.addEventListener('devicemotion', handleDeviceMotion);
        motionEnabled = true;
        btnMotionText.textContent = 'Sensor activo';
        btnMotion.classList.add('bg-emerald-500/25', 'border-emerald-300/50', 'text-emerald-200');
        showToast('¡Sensor activado! Agita tu dispositivo 📱✨');
      } else {
        showToast('En PC usa el botón "Sacudir" o mueve el ratón 🎄');
        triggerShakeImpulse(1);
      }
    }

    // En Android / navegadores que no requieren permiso explícito, enganchar desde el inicio
    if ('DeviceMotionEvent' in window && typeof DeviceMotionEvent.requestPermission !== 'function') {
      window.addEventListener('devicemotion', handleDeviceMotion);
      motionEnabled = true;
      btnMotionText.textContent = 'Sensor activo';
    }

    btnMotion.addEventListener('click', enableMotionSensor);
    btnShake.addEventListener('click', () => triggerShakeImpulse(1.2));
    btnReset.addEventListener('click', () => {
      initOrnaments();
      spawnSparkles(width / 2, height / 2, 24);
      showToast('Pelotitas navideñas renovadas ✨');
    });

    // =========================================================================
    // 7. INTERACCIÓN CON RATÓN Y PANTALLA TÁCTIL
    // =========================================================================
    function updatePointerPosition(x, y) {
      if (pointer.prevX !== -9999) {
        pointer.vx = x - pointer.prevX;
        pointer.vy = y - pointer.prevY;
      }
      pointer.prevX = x;
      pointer.prevY = y;
      pointer.x = x;
      pointer.y = y;
      pointer.active = true;
    }

    window.addEventListener('pointermove', (e) => {
      updatePointerPosition(e.clientX, e.clientY);
    }, { passive: true });

    window.addEventListener('pointerdown', (e) => {
      // Ignorar si el clic fue sobre los botones o el reproductor
      if (e.target.closest('button')) return;
      updatePointerPosition(e.clientX, e.clientY);
      triggerShockwave(e.clientX, e.clientY);
    }, { passive: true });

    window.addEventListener('pointerup', () => {
      pointer.active = false;
      pointer.prevX = -9999;
      pointer.prevY = -9999;
      pointer.vx = 0;
      pointer.vy = 0;
    }, { passive: true });

    window.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches.length > 0) {
        updatePointerPosition(e.touches[0].clientX, e.touches[0].clientY);
      }
    }, { passive: true });

    window.addEventListener('touchend', () => {
      pointer.active = false;
      pointer.prevX = -9999;
      pointer.prevY = -9999;
    }, { passive: true });

    // =========================================================================
    // 8. BUCLE PRINCIPAL DE ANIMACIÓN Y REDIMENSIONAMIENTO
    // =========================================================================
    function resizeCanvas() {
      width = window.innerWidth;
      height = window.innerHeight;
      dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      // Mantener las esferas dentro de los nuevos límites
      ornaments.forEach((ball) => {
        ball.x = Math.min(Math.max(ball.radius, ball.x), Math.max(ball.radius, width - ball.radius));
        ball.y = Math.min(Math.max(ball.radius, ball.y), Math.max(ball.radius, height - ball.radius));
      });
    }

    function animate() {
      ctx.clearRect(0, 0, width, height);

      // 1. Dibujar copos de nieve suaves en el fondo
      snowflakes.forEach((flake) => {
        flake.y += flake.speedY;
        flake.drift += 0.015;
        flake.x += Math.sin(flake.drift) * 0.45;

        if (flake.y > height + 5) {
          flake.y = -5;
          flake.x = Math.random() * width;
        }
        if (flake.x > width + 5) flake.x = -5;
        if (flake.x < -5) flake.x = width + 5;

        ctx.save();
        ctx.fillStyle = `rgba(255, 255, 255, ${flake.alpha})`;
        ctx.beginPath();
        ctx.arc(flake.x, flake.y, flake.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      // 2. Actualizar y resolver colisiones de las pelotitas navideñas
      for (let i = 0; i < ornaments.length; i++) {
        ornaments[i].update();
      }
      resolveBallCollisions();

      // 3. Dibujar pelotitas navideñas
      for (let i = 0; i < ornaments.length; i++) {
        ornaments[i].draw(ctx);
      }

      // 4. Dibujar ondas expansivas al tocar
      for (let i = shockwaves.length - 1; i >= 0; i--) {
        const sw = shockwaves[i];
        sw.radius += 11;
        sw.alpha *= 0.92;
        if (sw.radius >= sw.maxRadius || sw.alpha <= 0.02) {
          shockwaves.splice(i, 1);
          continue;
        }
        ctx.save();
        ctx.strokeStyle = `rgba(253, 224, 71, ${sw.alpha})`;
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      // 5. Dibujar destellos dorados
      for (let i = sparkles.length - 1; i >= 0; i--) {
        const sp = sparkles[i];
        sp.x += sp.vx;
        sp.y += sp.vy;
        sp.vx *= 0.95;
        sp.vy *= 0.95;
        sp.life -= sp.decay;

        if (sp.life <= 0) {
          sparkles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = sp.life;
        ctx.fillStyle = sp.color;
        ctx.shadowColor = '#fde047';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(sp.x, sp.y, sp.size * sp.life, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      // Atenuar velocidad del puntero entre frames
      pointer.vx *= 0.7;
      pointer.vy *= 0.7;

      animationId = requestAnimationFrame(animate);
    }

    function startApp() {
      resizeCanvas();
      createOrnamentSprites();
      initSnowflakes();
      initOrnaments();
      if (animationId) cancelAnimationFrame(animationId);
      animate();
    }

    window.addEventListener('resize', resizeCanvas);

    if (document.readyState === 'complete' || document.readyState === 'interactive') {
      startApp();
    } else {
      window.addEventListener('DOMContentLoaded', startApp);
    }
  </script>
